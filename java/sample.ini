[Default]
[S3]
# URL 설정
URL = 0.0.0.0

# Http Port 설정
Port = 80

# Old Http Port 설정
OldPort = 8080

# Https Port 설정
SSLPort = 443

# Signature Version.(2 or 4)
SignatureVersion = 2

# 리전
RegionName = ap-northeast-2

# 웹사이트 엔드포인트. {bucket}은 버킷명으로 치환된다. 비우면 웹사이트 접속 테스트를 건너뛴다.
#   AWS(가상 호스트): http://{bucket}.s3-website.ap-northeast-2.amazonaws.com
#   ksan(경로 방식):  http://<host>:<port>/website/{bucket}
WebsiteURL = 

[Fixtures]
## 테스트 버킷 생성시 접두어 설정
## 버킷의 길이제한인 63자리가 넘을경우 63자리까지 잘라서 사용하도록 동작
BucketPrefix = java-

# 기본적인 통신을 http, https중에서 선택
# true : https
# false : http
IsSecure = False

[Main User]
# Main DisplayName set in vstart.sh
DisplayName = test1

# Main UserIDname set in vstart.sh
UserID = 1

# AWS 계정 아이디(12자리). x-amz-expected-bucket-owner 검증에만 사용한다.
# 비워두면 UserID를 그대로 사용한다(ksan). AWS 대상 실행 시에만 채운다.
# 확인: aws sts get-caller-identity --query Account --output text
AccountId =

# Main Email set in vstart.sh
Email = test1@test.co.kr

# Main AWS access key
AccessKey = 123123123123123

# Main AWS secret key
SecretKey = 123123123123123

# replace with key id obtained when secret is created, or delete if KMS not tested
#KMS = 01234567-89ab-cdef-0123-456789abcdef

# X-Auth-Token for this user (optional, overrides global XAuthToken in [S3] section)
XAuthToken =

[Alt User]
# alt DisplayName set in vstart.sh
DisplayName = test1

# alt Email set in vstart.sh
Email = test1@test.co.kr

# alt UserID set in vstart.sh
UserID = 2

# alt AWS access key set in vstart.sh
AccessKey = 123123123123123

# alt AWS secret key set in vstart.sh
SecretKey = 123123123123123

# X-Auth-Token for this user (optional, overrides global XAuthToken in [S3] section)
XAuthToken =