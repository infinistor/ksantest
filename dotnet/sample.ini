[Default]

[S3]
# URL 설정
URL = 0.0.0.0

# Http Port 설정
Port = 80

# Https Port 설정
SSLPort = 443

## Signature Version.(2 or 4)
SignatureVersion = 2

# 리전
RegionName = ap-northeast-2

# 웹사이트 엔드포인트. {bucket}은 버킷명으로 치환된다. 비우면 웹사이트 접속 테스트를 건너뛴다.
#   AWS(가상 호스트): http://{bucket}.s3-website.ap-northeast-2.amazonaws.com
#   ksan(경로 방식):  http://<host>:<port>/website/{bucket}
WebsiteURL = 

[Fixtures]
# 기본적인 통신을 http, https중에서 선택
# true : https
# false : http
IsSecure = False

## 테스트 버킷 생성시 접두어 설정
## {random}은 15자리의 랜덤한 문자열로 자동 생성
## 버킷의 길이제한인 63자리가 넘을경우 63자리까지 잘라서 사용하도록 동작
BucketPrefix = s3-test-core-{random}-

# KMS(테스트 케이스가 존재하지 않음)
KMS = 

[Main User]
# 유저명
DisplayName = user1

# 유저 Id
UserId = 1

# AWS 계정 아이디(12자리). x-amz-expected-bucket-owner 검증에만 사용한다.
# 비워두면 UserId를 그대로 사용한다(ksan). AWS 대상 실행 시에만 채운다.
# 확인: aws sts get-caller-identity --query Account --output text
AccountId =

# 유저 Email
Email = user1@test.co.kr

# AWS Access Key
AccessKey = accesskey

# AWS Secret Key
SecretKey = secretkey

[Alt User]
# 유저명
DisplayName = user2

# 유저 Id
UserId = 2

# 유저 Email
Email = user2@test.co.kr

# AWS Access Key
AccessKey = accesskey

# AWS Secret Key
SecretKey = secretkey